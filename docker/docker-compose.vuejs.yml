# Vue.js dashboard overlay. Always combine with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.vuejs.yml up -d
# No top-level `name:` here on purpose: it would override the base project
# name and spin up a second copy of the whole stack.

services:
  # Production build served by nginx on DASHBOARD_PORT (default 5173).
  dashboard:
    build:
      context: ./vuejs
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      - kong

  # Hot-reload dev server: `--profile dev`, on port 5174.
  dashboard-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./vuejs:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    ports:
      - "5174:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host"

volumes:
  dashboard_node_modules:
