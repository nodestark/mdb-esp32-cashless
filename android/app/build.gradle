    // Upload key credentials live outside the repo (~/.gradle/gradle.properties):
    // VMFLOW_STORE_FILE, VMFLOW_STORE_PASSWORD, VMFLOW_KEY_ALIAS, VMFLOW_KEY_PASSWORD
    signingConfigs {
        release {
            if (project.hasProperty('VMFLOW_STORE_FILE')) {
                storeFile file(VMFLOW_STORE_FILE)
                storePassword VMFLOW_STORE_PASSWORD
                keyAlias VMFLOW_KEY_ALIAS
                keyPassword VMFLOW_KEY_PASSWORD
            }
        }
    }

    buildTypes {
